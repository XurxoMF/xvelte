map $http_x_forwarded_proto $redirect_to_https {
	default 0;
	http 1;
}

server {
	listen 3000 default_server;
	listen [::]:3000 default_server;
	server_name _;

	root /usr/share/nginx/xvelte;
	charset utf-8;
	absolute_redirect off;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	if ($redirect_to_https) {
		return 301 https://xvelte.xurxomf.xyz$request_uri;
	}

	location = /200.html {
		internal;
	}

	location /_app/immutable/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location / {
		rewrite ^/(.+)/$ /$1 permanent;
		try_files $uri /200.html;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		application/javascript
		application/json
		application/xml
		image/svg+xml;
}

server {
	listen 3000;
	listen [::]:3000;
	server_name www.xvelte.xurxomf.xyz;

	return 301 https://xvelte.xurxomf.xyz$request_uri;
}
